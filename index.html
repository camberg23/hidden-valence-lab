<style>
html,body{margin:0}
/* Layout: a single interactive figure per step. Figure title and one-line caption, the figure, then a hairline row of controls. */
:root{
  --bg:#FFFFFF; --ink:#15171B; --ink-2:#4A4E57; --muted:#8B9099; --line:#E5E7EB; --cell:#EEF0F3; --hover:#F5F6F8;
  --pos:#D4692B; --neg:#6653C1; --rand:#A9ADB5;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111215; --ink:#ECEDEF; --ink-2:#C2C5CC; --muted:#878B94; --line:#2A2C31; --cell:#212328; --hover:#1A1B1F;
  --pos:#EE8546; --neg:#9A88EE; --rand:#666A73; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111215; --ink:#ECEDEF; --ink-2:#C2C5CC; --muted:#878B94; --line:#2A2C31; --cell:#212328; --hover:#1A1B1F;
  --pos:#EE8546; --neg:#9A88EE; --rand:#666A73; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid color-mix(in srgb,var(--ink) 35%,transparent);outline-offset:2px;border-radius:4px}
.app{max-width:1140px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:22px 24px;display:flex;flex-direction:column;gap:20px}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.paper-title{font-weight:600;font-size:15px}
.paper-title span{font-weight:400;color:var(--muted);margin-left:10px}
.paper{font-size:13.5px;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}
.paper:hover{color:var(--ink);border-color:var(--ink-2)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:0 0 10px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button .n{font-family:var(--mono);font-size:12px;margin-right:7px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button:hover{color:var(--ink)}

.stage{display:flex;flex-direction:column;gap:22px;min-height:0}
.stage.enter{animation:enter .35s ease-out}
@keyframes enter{from{opacity:.001}to{opacity:1}}
.hero{display:flex;flex-direction:column;gap:4px;max-width:860px}
.hero h1{font-size:21px;line-height:1.3;letter-spacing:-.005em;font-weight:500;margin:0;text-wrap:balance}
.hero p{margin:0;font-size:14.5px;color:var(--muted);max-width:76ch}

.duo{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:48px;align-items:center}
.duo.flip{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.chartwrap{display:flex;flex-direction:column;gap:12px;min-width:0}
.chart{width:100%;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tk{font-family:var(--mono);font-size:11.5px;fill:var(--muted)}
.ttl{font-size:12.5px;fill:var(--muted)}
.dl{font-size:12.5px;font-weight:500}
.ctlrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.readout{display:flex;flex-direction:column;gap:10px;min-width:0}
.rlab{font-size:12.5px;color:var(--muted)}
.big{font-size:30px;line-height:1.1;font-weight:500;letter-spacing:-.01em}
.fine{font-size:13px;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.split .z{display:flex;flex-direction:column;gap:2px}
.split .zn{font-size:13px;color:var(--ink-2)}
.split .z:not(.on) .big{color:var(--muted)}
.sbar{height:4px;border-radius:2px;background:var(--cell);overflow:hidden}
.sbar i{display:block;height:100%;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat+.stat{padding-top:16px;margin-top:6px;border-top:1px solid var(--line)}

.sel{position:relative;display:inline-flex;align-items:center}
.sel select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 30px 5px 10px;font-size:13.5px;cursor:pointer}
.sel::after{content:"";position:absolute;right:12px;top:50%;width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none;opacity:.55}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:4px 11px;font-size:13px;color:var(--ink-2);white-space:nowrap;text-align:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--cell);color:var(--ink);font-weight:500}
.seg button:disabled{opacity:.35;cursor:default;background:none}
.seg button:focus-visible{outline:2px solid color-mix(in srgb,var(--ink) 35%,transparent);outline-offset:-2px}
.asklab{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}

/* step 1 reader */
.reader{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,40%);align-items:center;gap:16px;height:36px;padding-inline:8px;border-radius:4px;transition:background .25s}
.rhead{height:28px;font-size:12.5px;color:var(--muted)}
.rhead .c3{display:flex;justify-content:space-between;align-items:baseline}
.rhead .ax{display:grid;grid-template-columns:1fr 1fr 1fr;width:100%;font-family:var(--mono);font-size:11.5px}
.rhead .ax span:nth-child(2){text-align:center}
.rhead .ax span:nth-child(3){text-align:right}
.hl{display:flex;gap:8px;align-items:baseline;min-width:0;white-space:nowrap}
.hl b{font-weight:500;color:var(--ink-2)}
.tag{font-family:var(--mono);font-size:11.5px;font-weight:500;text-align:center;padding:2px 0;border-radius:3px;color:var(--ink-2);background:var(--cell);transition:background .3s,color .3s}
.rrow.st .tag{background:var(--c);color:var(--bg)}
.txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-size:14px;transition:opacity .25s}
.strip{width:100%;height:20px;display:block}
.rrow.reading{background:var(--hover)}
.rrow.unread .txt{opacity:.3}
.live{font-size:12.5px;color:var(--c);opacity:0;transition:opacity .2s;display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.live.on{opacity:1}

/* step 4 excerpt */
.moment{display:flex;flex-direction:column;gap:12px}
.quote{border-left:2px solid var(--neg);padding:2px 0 2px 14px;font-size:15px;line-height:1.45;color:var(--ink)}
.call{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;font-family:var(--mono);font-size:13px;border:1px solid var(--ink-2);border-radius:5px;padding:4px 10px}
.call small{font-family:var(--sans);font-size:12.5px;color:var(--muted)}

/* controls */
.dock{display:flex;align-items:center;gap:24px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.grp{display:flex;align-items:center;gap:10px}
.dock .lab{font-size:12.5px;color:var(--muted)}
.rnd{display:flex;align-items:center;gap:2px;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.rnd button{all:unset;cursor:pointer;width:20px;height:22px;display:grid;place-items:center;border-radius:4px;color:var(--ink-2);font-family:var(--sans);font-size:15px}
.rnd button:hover{background:var(--hover)}
.slider{position:relative;width:min(240px,56vw);padding-bottom:13px}
.slider input{width:100%;appearance:none;-webkit-appearance:none;background:transparent;height:22px;margin:0;cursor:pointer;display:block}
.slider input::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--neg),var(--line) 50%,var(--pos))}
.slider input::-moz-range-track{height:2px;background:linear-gradient(90deg,var(--neg),var(--line) 50%,var(--pos))}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--bg);border:1.5px solid var(--ink);margin-top:-6.5px}
.slider input::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--bg);border:1.5px solid var(--ink)}
.slider input:focus{outline:none}
.slider input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 15%,transparent)}
.slider .ticks{position:absolute;left:7.5px;right:7.5px;bottom:0;height:10px;pointer-events:none}
.slider .ticks span{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1}
.doseval{font-family:var(--mono);font-size:15px;font-weight:500;min-width:40px}
.play{all:unset;cursor:pointer;font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:6px;color:var(--ink-2);white-space:nowrap}
.play:hover{background:var(--hover);color:var(--ink)}
.play:focus-visible{outline:2px solid color-mix(in srgb,var(--ink) 35%,transparent);outline-offset:2px}

/* notes under each figure */
.notes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.notes li{font-size:13.5px;line-height:1.5;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px}
/* valence-direction preamble */
.pcard{display:flex;flex-direction:column;gap:12px;min-width:0}
.pstate{font-size:13.5px;color:var(--muted)}
.pstate b{font-weight:600}
.pq{border-left:2px solid var(--c,var(--line));padding:2px 0 2px 14px;font-size:15px;line-height:1.5;min-height:9.2em;color:var(--ink);transition:border-color .3s}
.pq.formula{font-family:var(--mono);font-size:13.5px;line-height:1.8;color:var(--ink-2)}
.plist{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.plist .k{display:inline-block;min-width:74px;color:var(--ink-2)}
.plist i{font-style:normal;transition:color .25s}
.plist i.cur{color:var(--ink);font-weight:500}
.scatter svg{display:block;width:100%;height:auto;overflow:visible}
.dg circle{opacity:0;transition:opacity .5s ease}
.dg.on circle{opacity:.72}
.slab{font-size:11.5px;fill:var(--muted);opacity:0;transition:opacity .4s}
.slab.on{opacity:1}
.fade{opacity:0;transition:opacity .5s}
.fade.on{opacity:1}
.grow{stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)}
.on>.grow{stroke-dashoffset:0}
.ahead{opacity:0;transition:opacity .3s .7s}
.on>.ahead{opacity:1}
#g-raw{transition:opacity .6s}
#g-raw.dim{opacity:.25}
.auto{margin-left:auto}
.notime .dg circle,.notime .slab,.notime .fade,.notime .grow,.notime .ahead{transition:none!important}
footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:3px;padding:0 4px}

@media (max-width:860px){
  .duo,.duo.flip{grid-template-columns:minmax(0,1fr);gap:24px}
  .rrow{grid-template-columns:32px minmax(0,1fr) minmax(0,36%);gap:10px;padding-inline:2px}
  .rhead .ax{display:none}
  .rhead .hl span{display:none}
  .tabs{gap:18px}
  .dock{gap:16px}
  footer .keys{display:none}
  .notes{grid-template-columns:minmax(0,1fr);gap:10px}
  .auto{margin-left:0}
}
@media (max-width:480px){.tabs button .n{display:none}.paper-title span{display:block;margin-left:0}}
@media (prefers-reduced-motion: reduce){.stage.enter{animation:none}.sbar i{transition:none}}
</style>
</head>

/* ---------- charts ---------- */
function niceStep(m){const raw=m/3;const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return (f<1.5?1:f<3.5?2:f<7.5?5:10)*p;}
function lineChart(o){
 const w=Math.max(280,o.w),h=o.h,m={l:46,r:o.mr??104,t:30,b:30};
 const all=o.series.flatMap(s=>s.pts.map(p=>p[1]));
 const ymax=o.ylim??Math.max(0.25,...all.map(Math.abs))*1.08;const ymin=o.ymin??-ymax;
 const X=x=>m.l+(x+1)/2*(w-m.l-m.r),Y=y=>m.t+(1-(y-ymin)/(ymax-ymin))*(h-m.t-m.b);
 const step=niceStep((ymax-ymin)/2);const ticks=[];for(let v=Math.ceil(ymin/step-1e-9)*step;v<=ymax+1e-9;v+=step)ticks.push(+v.toFixed(6));
 const yf=o.yfmt||(v=>v===0?'0':fmt(v,step<1?1:0));
 let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.aria)}">`;
 s+=`<text class="ttl" x="0" y="12">${esc(o.yTitle)}</text>`;
 ticks.forEach(v=>{s+=`<line x1="${m.l}" x2="${X(1)}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="${v===0?1.4:1}" ${v===0?'':'stroke-dasharray="2 4"'}/><text class="tk" x="${m.l-10}" y="${Y(v)+4}" text-anchor="end">${yf(v)}</text>`;});
 DOSES.forEach(d=>{s+=`<text class="tk" x="${X(d)}" y="${h-6}" text-anchor="middle">${doseTxt(d)}</text>`;});s+=`<text class="ttl" x="${X(1)+14}" y="${h-6}">dose</text>`;
 if(o.marker){s+=`<line data-k="mkl" x1="${X(o.marker.x)}" x2="${X(o.marker.x)}" y1="${m.t-6}" y2="${h-m.b+6}" stroke="var(--ink)" stroke-opacity=".12" stroke-width="1.5"/>`;}
 o.series.forEach(sr=>{s+=`<polyline data-k="${sr.k}" fill="none" stroke="${sr.color}" stroke-width="${sr.width||2}" stroke-opacity="${sr.opacity??1}" stroke-linejoin="round" stroke-linecap="round" points="${sr.pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`;
  if(sr.dots)sr.pts.forEach(p=>{s+=`<circle data-k="${sr.k}-${p[0]}" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3.5" fill="${sr.color}" fill-opacity="${sr.opacity??1}"/>`;});});
 if(o.marker){s+=`<circle data-k="mk" cx="${X(o.marker.x).toFixed(1)}" cy="${Y(o.marker.y).toFixed(1)}" r="8" fill="var(--bg)" stroke="${o.marker.color}" stroke-width="3"/>`;}
 // direct labels at the right end, spread so they never collide
 const labs=(o.labels||[]).map(l=>({...l,py:Y(l.y)})).sort((a,b)=>a.py-b.py);
 for(let i=1;i<labs.length;i++)if(labs[i].py-labs[i-1].py<17)labs[i].py=labs[i-1].py+17;
 for(let i=labs.length-1;i>=0;i--){const lim=i===labs.length-1?h-m.b:labs[i+1].py-17;if(labs[i].py>lim)labs[i].py=lim;}
 labs.forEach(l=>{s+=`<text class="dl" data-k="lab-${l.k}" x="${X(1)+14}" y="${(l.py+4.5).toFixed(1)}" fill="${l.color}" ${l.opacity!=null?`fill-opacity="${l.opacity}"`:''}>${esc(l.text)}</text>`;});
 return s+'</svg>';
}
const median=a=>{const b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)];};

function morph(m){
 if(RM||!m||!m.size)return;const tw=[];
 document.querySelectorAll('#stage [data-k]').forEach(el=>{const o=m.get(el.dataset.k);if(!o)return;
  if(el instanceof SVGElement){const to={};for(const a in o){const nv=el.getAttribute(a);if(nv==null||nv===o[a])continue;
    if(a==='points'){const A=parsePts(o[a]),B=parsePts(nv);if(A.length!==B.length)continue;to[a]=[A,B];}else to[a]=[+o[a],+nv];el.setAttribute(a,o[a]);}
   if(Object.keys(to).length)tw.push([el,to]);}
  else if(o.w&&o.w!==el.style.width){const nw=el.style.width,pt=el.style.transition;el.style.transition='none';el.style.width=o.w;void el.offsetWidth;el.style.transition=pt;el.style.width=nw;}});
 document.querySelectorAll('#stage [data-tw]').forEach(el=>{const ov=m.get('tw:'+el.dataset.tw),nv=+el.dataset.v,F=FMT[el.dataset.f];if(ov==null||ov===nv||!F)return;el.textContent=F(ov);tw.push([el,{_t:[ov,nv,F]}]);});
 if(!tw.length)return;cancelAnimationFrame(morphRaf);const t0=performance.now(),D=480,ease=u=>1-Math.pow(1-u,3);
 const f=now=>{const u=Math.min(1,(now-t0)/D),e=ease(u);
  tw.forEach(([el,to])=>{for(const a in to){const [A,B,F]=to[a];
   if(a==='_t')el.textContent=F(u>=1?B:A+(B-A)*e);
   else if(a==='points')el.setAttribute('points',A.map((p,i)=>(p[0]+(B[i][0]-p[0])*e).toFixed(1)+','+(p[1]+(B[i][1]-p[1])*e).toFixed(1)).join(' '));
   else el.setAttribute(a,(A+(B-A)*e).toFixed(2));}});
  if(u<1)morphRaf=requestAnimationFrame(f);};
 morphRaf=requestAnimationFrame(f);}
function tweenVis(){
 cancelAnimationFrame(visRaf);const from=S.vis,to=S.dose;if(RM||from===to){S.vis=to;drawStrips();return;}
 const t0=performance.now();const f=now=>{const u=Math.min(1,(now-t0)/380),e=1-Math.pow(1-u,3);S.vis=from+(to-from)*e;drawStrips();if(u<1)visRaf=requestAnimationFrame(f);};visRaf=requestAnimationFrame(f);}

/* ---------- render ---------- */
const stage=$('#stage');
function render(enter){
 const v=V[S.step];const m=enter?null:snap();
 stage.innerHTML=`<div class="hero"><h1>${v.head()}</h1><p>${v.sub()}</p></div>${v.body()}`;
 const nl=$('#notes');const ns=v.notes?v.notes():[];nl.hidden=!ns.length;nl.innerHTML=ns.map(n=>`<li>${n}</li>`).join('');
 if(enter&&!RM){stage.classList.remove('enter');void stage.offsetWidth;stage.classList.add('enter');}
 v.mount&&v.mount();bindStage();morph(m);syncDock();
}
function bindStage(){
 const ms=$('#model');if(ms)ms.onchange=()=>{S.model=ms.value;if(S.model!=='OLMo-2-32B')S.ask='continue';render();};
 document.querySelectorAll('#stage [data-ask]').forEach(b=>b.onclick=()=>{if(b.disabled)return;S.ask=b.dataset.ask;render();});
}
function renderTabs(){
 $('#tabs').innerHTML=STEPS.map((s,i)=>`<button role="tab" id="tab-${s.id}" aria-selected="${S.step===s.id}" data-step="${s.id}"><span class="n">${i+1}</span>${s.t}</button>`).join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.step));
}
function go(id){if(id===S.step)return;autoClear();dirTimers.forEach(clearTimeout);cancelAnimationFrame(readRaf);S.readProg=null;S.step=id;try{localStorage.setItem('hvl3-step',id)}catch(e){}renderTabs();render(true);AUTO.on=true;startAuto();}

/* ---------- dock ---------- */
const dose=$('#dose');let dragging=false;
$('#ticks').innerHTML=DOSES.map((d,i)=>`<span style="left:${i*25}%">${doseTxt(d)}</span>`).join('');
$('#stageSeg').innerHTML=STAGES.map((s,i)=>`<button id="ck-${i}" data-ck="${i}">${s.n}</button>`).join('');
const show={vector:['play','auto'],steer:['dir','dose','zone','play','auto'],choose:['dir','dose','auto'],remember:['dose','auto'],escape:['dir','dose','auto'],origins:['stage','auto']};
function syncDock(){
 const vis=show[S.step];$('#replay').textContent='Replay';['dir','dose','zone','play','stage','auto'].forEach(g=>{$('#g-'+g).hidden=!vis.includes(g);});
 document.querySelectorAll('[data-dir]').forEach(b=>b.setAttribute('aria-pressed',S.dir===b.dataset.dir));
 $('#rnd').hidden=S.dir!=='random';$('#rlab').textContent='#'+String(S.rand).padStart(2,'0');
 document.querySelectorAll('[data-zone]').forEach(b=>b.setAttribute('aria-pressed',S.zone===b.dataset.zone));
 document.querySelectorAll('[data-ck]').forEach(b=>b.setAttribute('aria-pressed',S.ck===+b.dataset.ck));
 const dv=$('#doseval');dv.textContent=doseTxt(S.dose);dv.style.color=signVar()==='var(--muted)'?'var(--ink-2)':signVar();
 if(!dragging&&!thumbRaf&&!sweeping)dose.value=(di(S.dose))*250;
 syncAutoBtn();
}
let thumbRaf=0;
function glideThumb(){cancelAnimationFrame(thumbRaf);const from=+dose.value,to=di(S.dose)*250;if(RM||from===to){dose.value=to;thumbRaf=0;return;}
 const t0=performance.now();const f=now=>{const u=Math.min(1,(now-t0)/200),e=1-Math.pow(1-u,3);dose.value=from+(to-from)*e;if(u<1)thumbRaf=requestAnimationFrame(f);else thumbRaf=0;};thumbRaf=requestAnimationFrame(f);}
function setDose(d,{drag=false}={}){
 if(d===S.dose){return;}S.dose=d;render();
 if(!drag){if(S.step==='steer')tweenVis();glideThumb();}
}
dose.addEventListener('input',()=>{dragging=true;cancelAnimationFrame(thumbRaf);thumbRaf=0;const t=+dose.value/250;S.vis=-1+t*0.5;cancelAnimationFrame(visRaf);
 const d=DOSES[Math.round(t)];if(d!==S.dose)setDose(d,{drag:true});else if(S.step==='steer')drawStrips();});
dose.addEventListener('change',()=>{dragging=false;glideThumb();if(S.step==='steer')tweenVis();});
dose.addEventListener('pointerup',()=>{if(dragging){dragging=false;glideThumb();if(S.step==='steer')tweenVis();}});
dose.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();e.stopPropagation();stepDose(e.key==='ArrowRight'||e.key==='ArrowUp'?1:-1);}});
function stepDose(k){const i=clamp(di(S.dose)+k,0,4);setDose(DOSES[i]);}
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{S.dir=b.dataset.dir;if(S.step==='steer'){render();}else render();});
$('#rprev').onclick=()=>{S.rand=S.rand===1?24:S.rand-1;render();};
$('#rnext').onclick=()=>{S.rand=S.rand===24?1:S.rand+1;render();};
document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{S.zone=b.dataset.zone;render();});
document.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{S.ck=+b.dataset.ck;render();});
$('#replay').onclick=()=>{if(S.step==='vector'){autoClear();playDir();if(AUTO.on)startAuto(true);}else{stopAuto();replay();}};

document.addEventListener('keydown',e=>{
 if(e.metaKey||e.ctrlKey||e.altKey)return;if(e.target.matches('select'))return;
 const k=e.key;
 if(/^[1-6]$/.test(k)){go(STEPS[+k-1].id);return;}
 if(k==='p'||k==='P'){toggleAuto();return;}
 if(['ArrowRight','ArrowLeft','r','R','z','Z',' '].includes(k))stopAuto();
 if(k==='ArrowRight'||k==='ArrowLeft'){e.preventDefault();const s=k==='ArrowRight'?1:-1;if(S.step==='origins'){S.ck=clamp(S.ck+s,0,3);render();}else stepDose(s);return;}
 if(k==='r'||k==='R'){if(show[S.step].includes('dir')){S.dir=S.dir==='random'?'valence':'random';render();}return;}
 if(k==='z'||k==='Z'){if(S.step==='steer'){S.zone=other(S.zone);render();}return;}
 if(k===' '&&!e.target.matches('button')){if(S.step==='steer'){e.preventDefault();replay();}else if(S.step==='vector'){e.preventDefault();playDir();}}
});
let lastW=innerWidth,rzT=0;
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(Math.abs(innerWidth-lastW)>4){lastW=innerWidth;render();}else drawStrips();},120);});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>render());
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- autoplay: each step sweeps through its own states until the presenter takes over ---------- */
const AUTO={on:true,gen:0,timers:[]};let sweeping=false;
function autoClear(){AUTO.gen++;AUTO.timers.forEach(clearTimeout);AUTO.timers=[];sweeping=false;}
const wait=ms=>new Promise((res,rej)=>{const g=AUTO.gen;AUTO.timers.push(setTimeout(()=>g===AUTO.gen?res():rej(0),ms));});
const live=g=>{if(g!==AUTO.gen)throw 0;};
function syncAutoBtn(){const b=$('#autoBtn');b.textContent=AUTO.on?'Pause':'Resume';b.title=AUTO.on?'Pause the automatic walkthrough (P)':'Resume the automatic walkthrough (P)';b.setAttribute('aria-pressed',AUTO.on);}
function stopAuto(){if(!AUTO.on)return;AUTO.on=false;autoClear();dirTimers.forEach(clearTimeout);if(S.step==='vector')applyDir(13,true);
 if(S.step==='steer'){tweenVis();}glideThumb();syncAutoBtn();}
function toggleAuto(){if(AUTO.on)stopAuto();else{AUTO.on=true;syncAutoBtn();startAuto();}}
function sweepTo(to,ms){return new Promise((res,rej)=>{const g=AUTO.gen,from=S.vis,t0=performance.now();sweeping=true;
 const f=now=>{if(g!==AUTO.gen){rej(0);return;}const u=Math.min(1,(now-t0)/ms),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;S.vis=from+(to-from)*e;
  const d=DOSES[Math.round((S.vis+1)*2)];if(d!==S.dose){S.dose=d;render();}else drawStrips();dose.value=(S.vis+1)*500;
  if(u<1)requestAnimationFrame(f);else{sweeping=false;res();}};requestAnimationFrame(f);});}
async function stepThrough(list,ms){for(const d of list){if(d!==S.dose)setDose(d);await wait(ms);}}
const SEQ={
 vector:async g=>{while(true){playDir();await wait(DIR_LOOP);live(g);}},
 steer:async g=>{if(S.dose!==1){setDose(1);}await wait(500);
  while(true){await replay();live(g);await wait(1400);await sweepTo(S.dose>0?-1:1,4200);live(g);await wait(900);}},
 choose:async g=>{while(true){if(S.dir!=='valence'||S.ask!=='continue'){S.dir='valence';S.ask='continue';render();}
  await stepThrough([-1,-0.5,0,0.5,1],1200);await wait(1000);S.dir='random';render();await wait(1300);
  await stepThrough([0.5,0,-0.5,-1],1200);await wait(1000);S.dir='valence';render();await wait(900);}},
 remember:async g=>{while(true){await stepThrough([-1,-0.5,0,0.5,1],1300);await wait(900);await stepThrough([0.5,0,-0.5,-1],1300);await wait(900);}},
 escape:async g=>{if(S.dir!=='valence'){S.dir='valence';render();}while(true){await stepThrough([1,0.5,0,-0.5,-1],1300);await wait(1500);await stepThrough([-0.5,0,0.5,1],1100);await wait(900);}},
 origins:async g=>{while(true){for(let i=0;i<4;i++){if(S.ck!==i){S.ck=i;render();}await wait(i===3?3200:1700);}}}
};
function startAuto(keepDir){autoClear();syncAutoBtn();if(!AUTO.on)return;
 if(RM){if(S.step==='vector')applyDir(13,true);return;}
 const g=AUTO.gen;const run=SEQ[S.step];if(!run)return;
 if(S.step==='vector'&&keepDir){AUTO.timers.push(setTimeout(()=>{if(g===AUTO.gen)SEQ.vector(g).catch(()=>{});},DIR_LOOP));return;}
 run(g).catch(()=>{});}
$('#autoBtn').onclick=toggleAuto;
// any hands-on control stops the animation for this step
document.addEventListener('pointerdown',e=>{if(e.target.closest('#autoBtn,#tabs'))return;if(e.target.closest('#dock button,#dock input,#stage button,#stage select'))stopAuto();},true);

renderTabs();render(true);startAuto();
</script>
</body>
</html>
